# PVS-Studio Spider configuration.
#
# Every path is resolved inside the container. The whole `/data` directory is
# bind-mounted to `./data` on the host (see docker-compose.yml).
#
#   /data/src     - cloned git repositories
#   /data/work    - temporary build directories (compile_commands.json)
#   /data/reports - analysis reports (plog, json, html) + index.html + status.json

# Number of parallel jobs is auto-detected: all node cores minus 2 reserved
# for the system. Override per-project or globally via `jobs:` / SPIDER_JOBS.
convert_groups: "GA:1,2,3"
# Base URL used when generating shareable links for developers.
base_url: "https://www.fly-server.ru/pvs-studio"

# How many projects to build/analyze concurrently (parallel workers).
# Override via `parallel:` / SPIDER_PARALLEL.
parallel: 2

projects:
  - name: jsoncpp
    repo: https://github.com/open-source-parsers/jsoncpp.git
    ref: master
    description: "JSON parser and writer for C++"

  - name: leveldb
    repo: https://github.com/google/leveldb.git
    ref: main
    description: "Fast key-value storage library (C++)"
    cmake_options:
      - -DLEVELDB_BUILD_TESTS=OFF
      - -DLEVELDB_BUILD_BENCHMARKS=OFF

  - name: GameNetworkingSockets
    repo: https://github.com/ValveSoftware/GameNetworkingSockets.git
    ref: master
    description: "Reliable/unreliable messaging over UDP (C++)"

  - name: airdc
    repo: https://github.com/airdcpp/airdcpp-core.git
    ref: master
    description: "AirDC++ core library (Windows)"
    enabled: false
    cmake_project_include: app/cmake/legacy-check-modules.cmake
    cmake_options:
      - -DCMAKE_MODULE_PATH=/app/app/cmake
      - -DVERSION=1.0.0

  - name: civetweb
    repo: https://github.com/civetweb/civetweb.git
    ref: master
    description: "Embedded C/C++ web server"

  - name: cppcheck
    repo: https://github.com/danmar/cppcheck.git
    ref: main
    description: "Static analysis tool for C/C++"

  - name: cppkafka
    repo: https://github.com/mfontanini/cppkafka.git
    ref: master
    description: "C++ client for Apache Kafka"

  - name: ecal
    repo: https://github.com/eclipse-ecal/ecal.git
    ref: master
    description: "eCAL - high performance communication layer"
    enabled: false

  - name: far2l
    repo: https://github.com/elfmz/far2l.git
    ref: master
    description: "Linux port of FAR v2 file manager"

  - name: farmanager
    repo: https://github.com/FarGroup/FarManager.git
    ref: master
    description: "File and Archive Manager (Windows)"
    enabled: false

  - name: flylinkdc-hub
    repo: https://github.com/pavel-pimenov/flylinkdc-hub.git
    ref: master
    description: "DC++ hub server (dc.fly-server.ru)"

  - name: haproxy
    repo: https://github.com/haproxy/haproxy.git
    ref: master
    description: "HAProxy load balancer"
    build_cmd: "make -j{jobs} TARGET=linux-glibc USE_OPENSSL=1 USE_PCRE2=1 USE_ZLIB=1"

  - name: libmdbx
    repo: https://github.com/isar/libmdbx.git
    ref: master
    description: "Fast embedded key-value store (MDBX)"

  - name: librats
    repo: https://github.com/librats/librats.git
    ref: master
    description: "High-performance lightweight P2P library"

  - name: librdkafka
    repo: https://github.com/confluentinc/librdkafka.git
    ref: master
    description: "Apache Kafka C/C++ library"

  - name: libtorrent
    repo: https://github.com/arvidn/libtorrent.git
    ref: RC_2_1
    description: "Efficient C++ bittorrent implementation"
    cmake_options:
      - -Dwebtorrent=OFF
    submodules:
      - deps/try_signal

  - name: libzmq
    repo: https://github.com/zeromq/libzmq.git
    ref: master
    description: "ZeroMQ core messaging engine (C)"
    cmake_options:
      - -DBUILD_TESTS=OFF
      - -DBUILD_SHARED=ON
      - -DWITH_DOCS=OFF
      - -DWITH_PERF_TOOL=OFF

  - name: lighttpd
    repo: https://github.com/lighttpd/lighttpd1.4.git
    ref: master
    description: "lighttpd web server (C)"

  - name: mediainfo
    repo: https://github.com/MediaArea/MediaInfo.git
    ref: master
    description: "Technical and tag information viewer"
    enabled: false

  - name: mpc-be-core
    repo: https://github.com/Aleksoid1978/MPC-BE.git
    ref: master
    description: "Media Player Classic - BE (core)"
    enabled: false

  - name: mtproxy
    repo: https://github.com/TelegramMessenger/MTProxy.git
    ref: master
    description: "MTProxy for Telegram (C)"
    build_cmd: "make -j{jobs}"

  - name: open62541
    repo: https://github.com/open62541/open62541.git
    ref: master
    description: "OPC UA implementation (C)"

  - name: rapidjson
    repo: https://github.com/Tencent/rapidjson.git
    ref: master
    description: "Fast JSON parser/generator for C++"
    cmake_options:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5

  - name: verlihub
    repo: https://github.com/Verlihub/verlihub.git
    ref: master
    description: "Verlihub DC++ hub software (C++)"
    cmake_options:
      - -DMYSQL_INCLUDE_DIR=/usr/include/mariadb
      - -DMYSQL_LIBRARIES=/usr/lib/x86_64-linux-gnu/libmariadbclient.so
      - -DUSE_CUSTOM_AUTOSPRINTF=ON

  - name: wolfssl
    repo: https://github.com/wolfSSL/wolfssl.git
    ref: master
    description: "TLS/SSL library written in C"

  - name: mbedtls
    repo: https://github.com/Mbed-TLS/mbedtls.git
    ref: mbedtls-3.6
    description: "Mbed TLS (ex-PolarSSL) TLS/SSL and crypto library (C)"
    submodules:
      - framework

  - name: wxWidgets
    repo: https://github.com/wxWidgets/wxWidgets.git
    ref: master
    description: "Cross-platform C++ GUI library"
    submodules:
      - src/zlib
      - src/expat
      - src/png
      - src/jpeg
      - src/tiff
      - 3rdparty/libwebp
      - src/stc/scintilla
      - src/stc/lexilla

  - name: zlib-ng
    repo: https://github.com/zlib-ng/zlib-ng.git
    ref: develop
    description: "zlib replacement with optimizations"

  - name: zstd
    repo: https://github.com/facebook/zstd.git
    ref: dev
    description: "Zstandard compression (C)"

# Batch 1 (2026-08): top C++ libraries, CMake-based, no extra system deps.
  - name: catch2
    repo: https://github.com/catchorg/Catch2.git
    ref: devel
    description: "C++ test framework"

  - name: flatbuffers
    repo: https://github.com/google/flatbuffers.git
    ref: master
    description: "Cross-platform serialization library"

  - name: fmt
    repo: https://github.com/fmtlib/fmt.git
    ref: main
    description: "Modern C++ formatting library"

  - name: googletest
    repo: https://github.com/google/googletest.git
    ref: main
    description: "Google's C++ testing framework"

  - name: mimalloc
    repo: https://github.com/microsoft/mimalloc.git
    ref: main3
    description: "Compact general-purpose allocator"

  - name: nlohmann-json
    repo: https://github.com/nlohmann/json.git
    ref: develop
    description: "JSON for Modern C++ (header-only)"
    build_cmd: "echo \"#include <nlohmann/json.hpp>\" > tu.cpp && g++ -std=c++17 -Isingle_include -c tu.cpp -o tu.o"

  - name: onetbb
    repo: https://github.com/oneapi-src/oneTBB.git
    ref: master
    description: "Intel oneAPI Threading Building Blocks"

  - name: simdjson
    repo: https://github.com/simdjson/simdjson.git
    ref: master
    description: "High-performance JSON parser (SIMD)"

  - name: spdlog
    repo: https://github.com/gabime/spdlog.git
    ref: v1.x
    description: "Fast C++ logging library"

  # Batch 2 (2026-08): top C/C++ libraries, CMake-based, no extra system deps.
  - name: assimp
    repo: https://github.com/assimp/assimp.git
    ref: master
    description: "Open Asset Import Library (3D model formats)"

  - name: benchmark
    repo: https://github.com/google/benchmark.git
    ref: main
    description: "C++ microbenchmark support library"
    cmake_options:
      - -DBENCHMARK_ENABLE_GTEST_TESTS=OFF
      - -DBENCHMARK_ENABLE_TESTING=OFF

  - name: box2d
    repo: https://github.com/erincatto/box2d.git
    ref: main
    description: "2D physics engine for games"
    cmake_options:
      - -DBOX2D_BUILD_UNIT_TESTS=OFF
      - -DBOX2D_BUILD_TESTBED=OFF

  - name: brotli
    repo: https://github.com/google/brotli.git
    ref: master
    description: "Generic-purpose lossless compression (C)"

  - name: cereal
    repo: https://github.com/USCiLab/cereal.git
    ref: master
    description: "Header-only C++11 serialization"
    cmake_options:
      - -DCEREAL_BUILD_TESTS=OFF

  - name: doctest
    repo: https://github.com/doctest/doctest.git
    ref: master
    description: "Fast C++ single-header test framework"

  - name: double-conversion
    repo: https://github.com/google/double-conversion.git
    ref: master
    description: "Efficient double-to-string conversions"

  - name: gflags
    repo: https://github.com/gflags/gflags.git
    ref: main
    description: "Commandline flags module for C++"

  - name: glog
    repo: https://github.com/google/glog.git
    ref: master
    description: "C++ implementation of the Google logging module"

  - name: highway
    repo: https://github.com/google/highway.git
    ref: master
    description: "SIMD-accelerated C++ primitives"

  - name: libarchive
    repo: https://github.com/libarchive/libarchive.git
    ref: master
    description: "Multi-format archive and compression library (C)"

  - name: libuv
    repo: https://github.com/libuv/libuv.git
    ref: v1.x
    description: "Cross-platform asynchronous I/O (C)"

  - name: lz4
    repo: https://github.com/lz4/lz4.git
    ref: dev
    description: "Extremely fast compression (C)"
    cmake_src: build/cmake

  - name: pugixml
    repo: https://github.com/zeux/pugixml.git
    ref: master
    description: "Light-weight XML processing library"

  - name: range-v3
    repo: https://github.com/ericniebler/range-v3.git
    ref: master
    description: "Range algorithms for C++"

  - name: re2
    repo: https://github.com/google/re2.git
    ref: main
    description: "Fast regular expression library (C++)"

  - name: snappy
    repo: https://github.com/google/snappy.git
    ref: main
    description: "Fast compression/decompression library"
    cmake_options:
      - -DSNAPPY_BUILD_TESTS=OFF
      - -DSNAPPY_BUILD_BENCHMARKS=OFF

  - name: taskflow
    repo: https://github.com/taskflow/taskflow.git
    ref: master
    description: "Modern C++ task parallelism"

  - name: tinyxml2
    repo: https://github.com/leethomason/tinyxml2.git
    ref: master
    description: "Simple XML parser in C++"

  - name: yaml-cpp
    repo: https://github.com/jbeder/yaml-cpp.git
    ref: master
    description: "YAML parser/emitter for C++"

  - name: 4diac-forte
    repo: https://gitverse.ru/pavel-pimenov/4diac-forte.git
    ref: master
    description: "Eclipse 4diac FORTE IEC 61499 runtime (test project)"
    cmake_options:
      - -DFORTE_ARCHITECTURE=Posix
      - -DFORTE_BUILD_EXECUTABLE=OFF
      - -DFORTE_BUILD_STATIC_LIBRARY=ON
      - -DFORTE_MODULE_IEC61131=ON

  # Batch 3 (2026-08): timing checkpoint — per-phase build/PVS timings.
  - name: curl
    repo: https://github.com/curl/curl.git
    ref: master
    description: "Command line tool and library for transferring data with URLs (C)"

  - name: libpng
    repo: https://github.com/pnggroup/libpng.git
    ref: libpng16
    description: "Portable Network Graphics (PNG) reference library (C)"

  # Batch 5 (2026-08): json/image codecs + Google libs.
  - name: json-c
    repo: https://github.com/json-c/json-c.git
    ref: master
    description: "JSON parser/printer for C"

  - name: libwebp
    repo: https://github.com/webmproject/libwebp.git
    ref: main
    description: "WebP image codec library (C)"

  - name: abseil-cpp
    repo: https://github.com/abseil/abseil-cpp.git
    ref: master
    description: "Google Abseil common C++ libraries"

  - name: bullet3
    repo: https://github.com/bulletphysics/bullet3.git
    ref: master
    description: "3D physics simulation engine (C++)"
    cmake_options:
      - -DBUILD_BULLET2_DEMOS=OFF
      - -DBUILD_OPENGL3_DEMOS=OFF
      - -DBUILD_UNIT_TESTS=OFF
