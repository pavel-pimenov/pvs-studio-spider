services:
  spider:
    build: .
    image: pvs-studio-spider
    env_file: .env
    command: analyze
    volumes:
      - ./data:/data
      - ./projects.yaml:/app/projects.yaml:ro
      - ~/.config/PVS-Studio:/root/.config/PVS-Studio:ro
    environment:
      - SPIDER_CONFIG=/app/projects.yaml

  report-server:
    image: pvs-studio-spider
    command: serve
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
    environment:
      - SPIDER_REPORTS_DIR=/data/reports

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SPIDER_HTTPS_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}

volumes:
  caddy_data:
  caddy_config:
