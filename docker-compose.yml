services:
  spider:
    build: .
    image: pvs-studio-spider
    platform: linux/amd64
    env_file: .env
    command: analyze
    volumes:
      - ./data:/data
      - ${SPIDER_REPORTS_DIR:-/var/www/pvs-studio}:/var/www/pvs-studio
      - ./projects.yaml:/app/projects.yaml:ro
      - ./revisions.txt:/app/revisions.txt
      - ~/.config/PVS-Studio:/root/.config/PVS-Studio:ro
    environment:
      - SPIDER_CONFIG=/app/projects.yaml

  report-server:
    image: pvs-studio-spider
    command: serve
    restart: unless-stopped
    volumes:
      - ${SPIDER_REPORTS_DIR:-/var/www/pvs-studio}:/var/www/pvs-studio:ro
    environment:
      - SPIDER_REPORTS_DIR=${SPIDER_REPORTS_DIR:-/var/www/pvs-studio}


